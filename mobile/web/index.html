<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KDSPOZ Retail</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { overflow: hidden; background: #f4f7fb; font-family: 'Nirmala UI', 'Noto Sans Devanagari', 'Kohinoor Devanagari', Mukta, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      #root { display: flex; }
      /* Native TextInput on web: hide Chromium focus/autofill chrome */
      input, textarea { outline: none !important; }
      input:focus, textarea:focus { outline: none !important; box-shadow: none !important; }
      input:-webkit-autofill,
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
        transition: background-color 99999s ease-in-out 0s;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
